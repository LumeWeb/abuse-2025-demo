          type: object
      - description: Filter by priority
        in: query
        name: priority
        schema:
          items:
            type: string
          type: array
      - description: Time range
        in: query
        name: time_range
        schema:
          type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: integer
                type: array
          description: Time-series metrics data
        "400":
          content:
            application/json:
              schema:
