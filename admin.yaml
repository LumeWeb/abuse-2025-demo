info:
  description: Provides administrative endpoints for managing the Portal.
  title: Portal Admin API
  version: unknown
openapi: 3.0.0
paths:
  /api/abuse/analytics/blocklist/block-reasons:
    get:
      description: Retrieve a breakdown of block counts by block reason over a specified
        time range.
      parameters:
      - description: Time range
        in: query
        name: time_range
        schema:
          type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockReasonListResponse'
          description: Block reason counts
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid parameters
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Failed to retrieve block reason counts
      summary: Get block reason counts
      tags:
      - Analytics
  /api/abuse/analytics/cases:
    get:
      description: Retrieve overall case analytics with optional filtering
      parameters:
      - description: Ending index of the items to return (exclusive). Defaults to
          10.
        in: query
        name: _end
        schema:
          type: integer
      - description: Starting index of the items to return (0-based). Defaults to
          0.
        in: query
        name: _start
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAnalyticsResponse'
          description: Case analytics
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get case analytics
      tags:
      - Analytics
  /api/abuse/analytics/cases/7d:
